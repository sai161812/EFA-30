<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLUMA Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>PLUMA Autofill</h1>
      <p class="tag">Phase 1 · fictional profile</p>
    </header>
    <p id="status" role="status" aria-live="polite">Ready to scan the active page.</p>
    <button id="scan" type="button">Scan this page</button>
    <section id="preview" aria-labelledby="preview-heading" hidden>
      <h2 id="preview-heading">Review before filling</h2>
      <dl class="target-meta">
        <dt>Website origin</dt><dd id="origin"></dd>
        <dt>Profile</dt><dd id="profile"></dd>
      </dl>
      <p id="expiry" class="muted"></p>
      <p id="summary"></p>
      <div id="rows" class="rows"></div>
      <div class="actions">
        <button id="approve" type="button">Approve and fill selected</button>
        <button id="cancel" class="secondary" type="button">Cancel and clear preview</button>
      </div>
    </section>
    <section id="outcomes" aria-labelledby="outcomes-heading" hidden>
      <h2 id="outcomes-heading">Fill results</h2>
      <p id="outcome-summary"></p>
      <ul id="outcome-list"></ul>
    </section>
    <button id="settings" class="secondary" type="button">Open settings</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
